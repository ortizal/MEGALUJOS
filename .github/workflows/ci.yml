name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Backend: Java 21 (Temurin) + Maven
  # ---------------------------------------------------------------------------
  backend:
    name: Backend · Maven verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: mvn verify
        run: mvn -B -f backend/pom.xml verify

      - name: Subir jar empaquetado
        uses: actions/upload-artifact@v4
        with:
          name: megalujos-backend-jar
          path: backend/target/*.jar
          retention-days: 7
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Frontend: Node 24 + Angular 22 (workspace raíz con dos apps)
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend · Angular build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Build admin
        run: npx ng build admin

      - name: Build storefront
        run: npx ng build storefront

      - name: Subir dist admin
        uses: actions/upload-artifact@v4
        with:
          name: dist-admin
          path: frontend/dist/admin/browser
          retention-days: 7
          if-no-files-found: error

      - name: Subir dist storefront
        uses: actions/upload-artifact@v4
        with:
          name: dist-storefront
          path: frontend/dist/storefront/browser
          retention-days: 7
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Imágenes Docker: solo en push a main, SIN push real (dry-run con caché GHA)
  # ---------------------------------------------------------------------------
  docker-build:
    name: Docker · build (sin push)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ backend, frontend ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: megalujos-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build admin image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: megalujos-admin:ci
          build-args: |
            APP=admin
            BASE_HREF=/admin/
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build storefront image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: megalujos-storefront:ci
          build-args: |
            APP=storefront
            BASE_HREF=/
          cache-from: type=gha
          cache-to: type=gha,mode=max
