<section class="page" aria-labelledby="print-title">
  <header class="page__header">
    <div>
      <h1 id="print-title">Trabajos de impresión</h1>
      <p>Cola de tickets, cierres de caja, órdenes de servicio y etiquetas.</p>
    </div>
  </header>

  <div class="mega-card">
    <form class="toolbar toolbar--wrap" (ngSubmit)="applyFilters()" aria-label="Filtros de trabajos de impresión">
      <div style="min-width: 170px">
        <mega-select
          label="Estado"
          name="print-status"
          [options]="statusOptions"
          [ngModel]="status()"
          (ngModelChange)="status.set($event)"
        />
      </div>
      <button type="submit" class="visually-hidden" tabindex="-1" aria-hidden="true"></button>
      <mega-button (click)="applyFilters()" size="sm">Aplicar</mega-button>
      <button type="button" class="btn btn-outline-secondary btn-sm" (click)="clearFilters()">Limpiar</button>
    </form>
  </div>

  @if (error(); as message) {
    <mega-empty-state
      icon="⚠️"
      title="No se pudieron cargar los trabajos de impresión"
      [message]="message"
      actionLabel="Reintentar"
      (action)="load()"
    />
  } @else {
    <div class="mega-card mega-card--flush">
      <mega-table
        [columns]="columns()"
        [rows]="rows()"
        [loading]="loading()"
        [rowKey]="rowKey"
        emptyText="No hay trabajos de impresión."
        aria-label="Tabla de trabajos de impresión"
      />
      <ng-template #statusCell let-row>
        <mega-status-badge [status]="row.status" />
      </ng-template>
      <ng-template #actionsCell let-row>
        <div class="cell-actions">
          @if (row.status !== 'PRINTED') {
            <mega-button
              size="sm"
              variant="outline"
              (click)="markPrinted(row)"
            >
              Marcar impreso
            </mega-button>
          }
        </div>
      </ng-template>
    </div>

    @if (!loading() && rows().length) {
      <mega-pagination
        [page]="page()"
        [size]="size"
        [total]="total()"
        (pageChange)="goToPage($event)"
        aria-label="Paginación de trabajos de impresión"
      />
    }
  }
</section>
