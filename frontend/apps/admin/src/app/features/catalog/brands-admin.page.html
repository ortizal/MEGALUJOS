<section class="page" aria-labelledby="brands-title">
  <header class="page__header">
    <div>
      <h1 id="brands-title">Marcas</h1>
      <p>Marcas de catálogo para productos y filtros públicos.</p>
    </div>
    <div class="page__actions">
      <mega-button size="sm" (click)="openCreate()">+ Nueva marca</mega-button>
    </div>
  </header>

  <div class="mega-card mega-card--flush">
    <mega-table
      [columns]="columns()"
      [rows]="rows()"
      [loading]="loading()"
      [rowKey]="rowKey"
      emptyText="Aún no hay marcas. Crea la primera."
      aria-label="Tabla de marcas"
    />

    <ng-template #actionsCell let-row>
      <div class="cell-actions">
        <mega-button size="sm" variant="ghost" (click)="openEdit(row)">Editar</mega-button>
        <mega-button size="sm" variant="outline" (click)="toggleActive(row)">
          {{ row.active ? 'Desactivar' : 'Activar' }}
        </mega-button>
      </div>
    </ng-template>
  </div>
</section>

<mega-modal [open]="modalOpen()" [title]="editingId() ? 'Editar marca' : 'Nueva marca'" (close)="modalOpen.set(false)">
  <form class="d-grid gap-3" (ngSubmit)="save()">
    <button type="submit" class="visually-hidden" tabindex="-1" aria-hidden="true"></button>
    <mega-input label="Nombre" name="brand-name" [ngModel]="name()" (ngModelChange)="name.set($event)" />
  </form>
  <div class="d-flex justify-content-end gap-2 mt-3" megaModalFooter>
    <mega-button variant="ghost" (click)="modalOpen.set(false)">Cancelar</mega-button>
    <mega-button (click)="save()" [loading]="saving()">Guardar</mega-button>
  </div>
</mega-modal>
