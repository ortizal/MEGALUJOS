# =============================================================================
# MEGALUJOS — nginx (HTTP, puertos 80/443)
# Montado en infra/compose.yaml como /etc/nginx/nginx.conf
# TLS: ver infra/nginx/nginx-tls.conf.example
# =============================================================================
user                  nginx;
worker_processes      auto;
error_log             /var/log/nginx/error.log warn;
pid                   /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;
    charset             utf-8;

    log_format main     '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" rt=$request_time';
    access_log          /var/log/nginx/access.log main;

    sendfile            on;
    tcp_nopush          on;
    keepalive_timeout   65;
    server_tokens       off;

    # Subidas (imágenes de productos, diseños de stickers, RIDE...)
    # Coincide con spring.servlet.multipart.max-request-size=50MB
    client_max_body_size    50M;
    client_body_buffer_size 128k;

    # --- Compresión ---------------------------------------------------------
    gzip                on;
    gzip_vary           on;
    gzip_comp_level     5;
    gzip_min_length     256;
    gzip_proxied        any;
    gzip_types          text/plain text/css text/xml text/javascript
                        application/json application/javascript
                        application/xml application/xml+rss
                        image/svg+xml application/font-woff application/font-woff2;

    # --- Upstreams (red interna megalujos-network) --------------------------
    upstream backend_api {
        server backend:8080;
        keepalive 32;
    }

    upstream admin_app {
        server admin:80;
        keepalive 8;
    }

    upstream storefront_app {
        server storefront:80;
        keepalive 8;
    }

    # =========================================================================
    # Servidor principal (HTTP). Para TLS usar nginx-tls.conf.example.
    # =========================================================================
    server {
        listen              80;
        server_name         _;

        # --- Cabeceras de seguridad -----------------------------------------
        add_header X-Frame-Options           "SAMEORIGIN" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

        # --- API Spring Boot (60 s: consultas reporteras y emisión SRI) -----
        location /api/ {
            proxy_pass             http://backend_api;
            proxy_http_version     1.1;
            proxy_set_header       Host              $host;
            proxy_set_header       X-Real-IP         $remote_addr;
            proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header       X-Forwarded-Proto $scheme;
            proxy_set_header       Connection        "";
            proxy_connect_timeout  10s;
            proxy_send_timeout     60s;
            proxy_read_timeout     60s;
        }

        # --- Subidas de archivos --------------------------------------------
        location /uploads/ {
            proxy_pass             http://backend_api;
            proxy_http_version     1.1;
            proxy_set_header       Host              $host;
            proxy_set_header       X-Real-IP         $remote_addr;
            proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header       X-Forwarded-Proto $scheme;
            proxy_send_timeout     60s;
            proxy_read_timeout     60s;
        }

        # --- OpenAPI / Swagger UI -------------------------------------------
        location /swagger-ui {
            proxy_pass             http://backend_api;
            proxy_http_version     1.1;
            proxy_set_header       Host $host;
            proxy_set_header       X-Forwarded-Proto $scheme;
        }

        location /v3/api-docs {
            proxy_pass             http://backend_api;
            proxy_http_version     1.1;
            proxy_set_header       Host $host;
            proxy_set_header       X-Forwarded-Proto $scheme;
        }

        # --- Actuator: solo salud pública para monitores --------------------
        location = /actuator/health {
            proxy_pass             http://backend_api;
            proxy_http_version     1.1;
            proxy_set_header       Host $host;
        }

        location /actuator {
            return 404;
        }

        # --- Panel administrativo (/admin/ → contenedor admin en /) ---------
        location = /admin {
            return 301 /admin/;
        }

        location /admin/ {
            # Quita el prefijo /admin/ antes de proxy (base-href=/admin/)
            rewrite ^/admin/(.*)$ /$1 break;
            proxy_pass             http://admin_app;
            proxy_http_version     1.1;
            proxy_set_header       Host              $host;
            proxy_set_header       X-Real-IP         $remote_addr;
            proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header       X-Forwarded-Proto $scheme;
            proxy_set_header       Connection        "";
        }

        # --- Storefront (SPA, ruta raíz) ------------------------------------
        location / {
            proxy_pass             http://storefront_app;
            proxy_http_version     1.1;
            proxy_set_header       Host              $host;
            proxy_set_header       X-Real-IP         $remote_addr;
            proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header       X-Forwarded-Proto $scheme;
            proxy_set_header       Connection        "";
        }

        location = /favicon.ico { access_log off; log_not_found off; }
    }

    # =========================================================================
    # ALTERNATIVA: admin en subdominio (admin.megalujos.com, base-href "/").
    # Activar cambiando los args de build del servicio `admin` a BASE_HREF=/
    # y descomentando este bloque.
    # =========================================================================
    # server {
    #     listen              80;
    #     server_name         admin.megalujos.com;
    #
    #     add_header X-Frame-Options        "SAMEORIGIN" always;
    #     add_header X-Content-Type-Options "nosniff" always;
    #     add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    #
    #     location / {
    #         proxy_pass             http://admin_app;
    #         proxy_http_version     1.1;
    #         proxy_set_header       Host              $host;
    #         proxy_set_header       X-Real-IP         $remote_addr;
    #         proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
    #         proxy_set_header       X-Forwarded-Proto $scheme;
    #     }
    # }
}
