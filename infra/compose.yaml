# =============================================================================
# MEGALUJOS — Docker Compose (VPS / integración completa)
# =============================================================================
# Servicios: postgres (privado) + backend + admin + storefront + nginx + backup.
#
# USO (desde la raíz del repo, con .env ya creado a partir de .env.example):
#   docker compose -f infra/compose.yaml --env-file .env up -d --build
# Desde dentro de infra/ (equivalente; .env de referencia sigue siendo el de la
# raíz, porque env_file apunta a ../.env):
#   docker compose --env-file .env up -d --build
#
# Útiles:
#   docker compose -f infra/compose.yaml --env-file .env ps
#   docker compose -f infra/compose.yaml --env-file .env logs -f backend
#   docker compose -f infra/compose.yaml --env-file .env exec backend sh
#   docker compose -f infra/compose.yaml --env-file .env run --rm backup /usr/local/bin/backup.sh
#
# SEGURIDAD
#   - El puerto 5432 NO se expone al host: postgres solo es alcanzable por la
#     red interna megalujos-network.
#   - Los secretos (JWT_SECRET, contraseñas, passphrase de backup, certificado
#     SRI) viven en .env (fuera de Git) y se inyectan en tiempo de ejecución;
#     NUNCA se copian a la imagen.
#
# TLS (producción) — ver infra/nginx/nginx-tls.conf.example:
#   1) Montar el volumen de certificados en el servicio nginx:
#        - ./nginx/certs:/etc/nginx/certs:ro
#        - ./nginx/nginx-tls.conf.example:/etc/nginx/nginx.conf:ro
#   2) Emitir certificados con certbot (una sola vez):
#        docker run --rm -v ./nginx/certs:/etc/letsencrypt \
#          certbot/certbot certonly --webroot -w /var/www/certbot \
#          -d megalujos.com -d www.megalujos.com -d admin.megalujos.com \
#          --email ops@megalujos.com --agree-tos --non-interactive
#   3) Renovación automática (cron en el host):
#        0 3 * * 1 docker run --rm -v ./nginx/certs:/etc/letsencrypt certbot/certbot renew
# =============================================================================

name: megalujos

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16 — red privada, sin puertos publicados al host
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: megalujos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-megalujos_db}
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME:-megalujos_user}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?Define SPRING_DATASOURCE_PASSWORD en .env}
      TZ: ${TZ:-America/Guayaquil}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - megalujos-network
    # Sin `ports:` a propósito: en el VPS el 5432 NO debe salir al host.
    # SOLO para desarrollo local (mvn spring-boot:run contra localhost), descomentar:
    # ports:
    #   - "5432:5432"
    # Acceso puntual desde el host sin publicar puerto:
    #   docker compose -f infra/compose.yaml --env-file .env exec postgres psql -U megalujos_user -d megalujos_db

  # ---------------------------------------------------------------------------
  # API Spring Boot (Java 21) — healthcheck /actuator/health
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: megalujos-backend:latest
    container_name: megalujos-api
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      SERVER_PORT: "8080"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-megalujos_db}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-megalujos_user}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?Define SPRING_DATASOURCE_PASSWORD en .env}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env (>= 32 caracteres)}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-120}
      JWT_REFRESH_EXPIRATION_DAYS: ${JWT_REFRESH_EXPIRATION_DAYS:-7}
      STORAGE_LOCAL_PATH: /app/uploads
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://megalujos.com,https://www.megalujos.com,https://admin.megalujos.com}
      SITE_URL: ${SITE_URL:-https://megalujos.com}
      # Facturación electrónica. SRI_ENVIRONMENT: TEST/PRODUCTION (cualquier
      # valor distinto de PRODUCTION se trata como pruebas; ver
      # docs/runbooks/sri-rotation.md)
      SRI_ENABLED: ${SRI_ENABLED:-false}
      SRI_ENVIRONMENT: ${SRI_ENVIRONMENT:-TEST}
      SRI_CERTIFICATE_PATH: ${SRI_CERTIFICATE_PATH:-/app/certificates/signature.p12}
      SRI_CERTIFICATE_PASSWORD: ${SRI_CERTIFICATE_PASSWORD:-}
    volumes:
      - uploads_data:/app/uploads
      # Certificado de firma electrónica P12 (activar al habilitar SRI_ENABLED=true):
      # - ./certs/sri:/app/certificates:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    networks:
      - megalujos-network

  # ---------------------------------------------------------------------------
  # Panel administrativo Angular (servido internamente en /, expuesto por
  # nginx en /admin/ con base-href /admin/)
  # ---------------------------------------------------------------------------
  admin:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        APP: admin
        BASE_HREF: /admin/
    image: megalujos-admin:latest
    container_name: megalujos-admin
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - megalujos-network

  # ---------------------------------------------------------------------------
  # Vitrina / storefront Angular (ruta raíz)
  # ---------------------------------------------------------------------------
  storefront:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        APP: storefront
        BASE_HREF: /
    image: megalujos-storefront:latest
    container_name: megalujos-storefront
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - megalujos-network

  # ---------------------------------------------------------------------------
  # Reverse proxy único de entrada (80/443)
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: megalujos-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # TLS (activar siguiendo la sección TLS de este archivo):
      # - ./nginx/nginx-tls.conf.example:/etc/nginx/nginx.conf:ro
      # - ./certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
      admin:
        condition: service_healthy
      storefront:
        condition: service_healthy
    networks:
      - megalujos-network

  # ---------------------------------------------------------------------------
  # Backup diario de PostgreSQL (pg_dump -Fc cifrado con AES-256)
  # Programación por cron dentro del contenedor (BACKUP_SCHEDULE, TZ del VPS).
  # Retención: RETENTION_DAYS (borrado de .sql.enc antiguos).
  # ---------------------------------------------------------------------------
  backup:
    build:
      context: ./backup
      dockerfile: Dockerfile
    image: megalujos-backup:latest
    container_name: megalujos-backup
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-megalujos_db}
      DB_USER: ${SPRING_DATASOURCE_USERNAME:-megalujos_user}
      PGPASSWORD: ${SPRING_DATASOURCE_PASSWORD:?Define SPRING_DATASOURCE_PASSWORD en .env}
      # Nota: BACKUP_PASSPHRETE es el nombre de la variable reservado en .env.
      # Si queda vacía el servicio de backup NO cifrará copias y lo avisará en log
      # (definirla siempre: ver infra/backup/README.md).
      BACKUP_PASSPHRETE: ${BACKUP_PASSPHRETE:-}
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-0 2 * * *}
      RETENTION_DAYS: ${RETENTION_DAYS:-14}
      TZ: ${TZ:-America/Guayaquil}
    volumes:
      - pgdata:/var/lib/postgresql/data:ro
      - backups:/backups
      # El script viaja DENTRO de la imagen (infra/backup/Dockerfile, modo 755):
      # cualquier cambio en backup.sh/entrypoint.sh exige
      #   docker compose -f infra/compose.yaml --env-file .env build backup
      # Si prefieres enlazarlo en caliente (requiere +x en el host):
      # - ./backup/backup.sh:/usr/local/bin/backup.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - megalujos-network

networks:
  megalujos-network:
    name: megalujos-network
    driver: bridge

volumes:
  # Datos de PostgreSQL (nunca expuestos al host)
  pgdata:
  # Subidas de archivos (imágenes, RIDE, diseños de stickers)
  uploads_data:
  # Copias cifradas generadas por el servicio backup
  backups:
