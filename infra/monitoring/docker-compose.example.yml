# MEGALUJOS — monitoreo (ejemplo mínimo)
# Uso:
#   docker compose -f infra/monitoring/docker-compose.example.yml up -d
# Requiere que la red megalujos-network exista (la crea infra/compose.yaml):
#   docker network create megalujos-network
#
# NO form parte de infra/compose.yaml: se levanta aparte para no acoplar el
# despliegue de la app al monitoreo.

services:
  # --- Logs en vivo de todos los contenedores (nivel mínimo recomendado) -----
  dozzle:
    image: amir20/dozzle:latest
    container_name: megalujos-logs
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8081:8080"
    networks:
      - megalujos-network
    # En producción: no publicar 8081 directamente; enrutar /logs en nginx con
    # autenticación básica o VPN.

  # --- Métricas (activar solo si se expone /actuator/prometheus) ------------
  # prometheus:
  #   image: prom/prometheus:latest
  #   container_name: megalujos-prometheus
  #   restart: unless-stopped
  #   volumes:
  #     - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
  #     - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
  #     - prometheus-data:/prometheus
  #   ports:
  #     - "9090:9090"
  #   networks:
  #     - megalujos-network
  #
  # grafana:
  #   image: grafana/grafana:latest
  #   container_name: megalujos-grafana
  #   restart: unless-stopped
  #   environment:
  #     GF_SECURITY_ADMIN_USER: admin
  #     GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?definir en .env}
  #   volumes:
  #     - grafana-data:/var/lib/grafana
  #     - ./grafana/provisioning:/etc/grafana/provisioning:ro
  #   ports:
  #     - "3000:3000"
  #   networks:
  #     - megalujos-network

networks:
  megalujos-network:
    external: true

