server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: megalujos-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/megalujos_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:12345}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 50MB

# Configuración propia de MEGALUJOS
megalujos:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4300}
  security:
    jwt:
      secret: ${JWT_SECRET:megalujos_super_secure_jwt_secret_key_2026_ecuador_automotive_access_token_at_least_256_bits_long_key}
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
      refresh-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:7}
    login:
      max-attempts: 5
      lockout-minutes: 15
  business:
    name: "MEGALUJOS"
    ruc: "1790012345001"
    whatsapp: "593999999999"
    currency: "USD"
    timezone: "America/Guayaquil"
    site-url: ${SITE_URL:http://localhost:4300}
  storage:
    upload-dir: ${STORAGE_LOCAL_PATH:./uploads}
  sri:
    enabled: ${SRI_ENABLED:false}
    environment: ${SRI_ENVIRONMENT:TEST}
    reception-url: ${SRI_RECEPTION_URL:https://p01-certificacion.sri.gob.ec/comprobantes-electronicos-ws/RecepcionComprobantesOffline}
    authorization-url: ${SRI_AUTHORIZATION_URL:https://p01-certificacion.sri.gob.ec/comprobantes-electronicos-ws/AutorizacionComprobantesOffline}
    certificate-path: ${SRI_CERTIFICATE_PATH:./certificates/signature.p12}
    certificate-password: ${SRI_CERTIFICATE_PASSWORD:}
    worker:
      poll-interval-ms: ${SRI_WORKER_POLL_MS:10000}
      max-attempts: ${SRI_WORKER_MAX_ATTEMPTS:5}
  printing:
    thermal-width-mm: ${PRINT_THERMAL_WIDTH_MM:80}
    default-printer: ${PRINT_DEFAULT_PRINTER:}

# OpenAPI Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

logging:
  level:
    root: INFO
    ec.com.megalujos: DEBUG
    org.springframework.security: INFO
